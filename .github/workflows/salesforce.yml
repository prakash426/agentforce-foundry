name: salesforce-validate
on:
  pull_request:
  workflow_dispatch:
jobs:
  org-validate:
    runs-on: ubuntu-latest
    outputs:
      has_secret: ${{ steps.gate.outputs.has_secret }}
      validation_status: ${{ steps.record.outputs.validation_status }}
      deployment_id: ${{ steps.record.outputs.deployment_id }}
      candidate_commit: ${{ steps.record.outputs.candidate_commit }}
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - id: gate
        name: check for validation secret
        run: echo "has_secret=${{ secrets.DX_AUTH_URL != '' }}" >> $GITHUB_OUTPUT
      - name: show tool versions
        if: steps.gate.outputs.has_secret == 'true'
        run: node -v && npm -v && python3 -V
      - name: install Salesforce CLI
        if: steps.gate.outputs.has_secret == 'true'
        run: npm i -g @salesforce/cli@2.157.8
      - name: authorize validation org
        if: steps.gate.outputs.has_secret == 'true'
        env:
          DX_AUTH_URL: ${{ secrets.DX_AUTH_URL }}
        run: printf '%s' "$DX_AUTH_URL" > /tmp/sfdx-auth.txt && sf org login sfdx-url -f /tmp/sfdx-auth.txt -a ci-org && rm -f /tmp/sfdx-auth.txt
      - name: validation only deploy of Service scope with its own test results
        if: steps.gate.outputs.has_secret == 'true'
        run: |
          set -o pipefail
          mkdir -p validation-results
          echo "Candidate commit: $GITHUB_SHA" | tee validation-results/candidate.txt
          sf project deploy start -o ci-org -x manifests/service-triage-validation.xml -l RunSpecifiedTests -t ServiceTriageActionTest -w 10 --dry-run --coverage-formatters json --coverage-formatters cobertura --junit --results-dir validation-results --json | tee validation-results/deploy-validation.json
      - name: verify validation payload
        if: steps.gate.outputs.has_secret == 'true'
        run: python3 scripts/verify_sf_output.py deploy validation-results/deploy-validation.json
      - id: record
        name: record validation identifiers
        if: steps.gate.outputs.has_secret == 'true'
        run: |
          python3 - <<'PY' >> $GITHUB_OUTPUT
          import json
          print("candidate_commit=${{ github.sha }}")
          data = json.load(open("validation-results/deploy-validation.json"))
          result = data.get("result", data)
          print("deployment_id=" + str(result.get("id", "unknown")))
          ok = result.get("status") == "Succeeded" and result.get("success") is True
          print("validation_status=" + ("passed" if ok else "failed"))
          PY
          cat validation-results/candidate.txt
      - name: keep validation only results
        if: always() && steps.gate.outputs.has_secret == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: validation-only-results
          path: validation-results
          if-no-files-found: warn
      - name: report skipped validation
        if: steps.gate.outputs.has_secret != 'true'
        run: |
          echo "Org validation not run: no DX_AUTH_URL repository secret present."
          echo "Add the secret to enable this path."
          echo "This is not deployment proof. It means the org path was skipped honestly."
  scratch-installed-tests:
    runs-on: ubuntu-latest
    needs: [org-validate]
    outputs:
      has_secret: ${{ steps.gate.outputs.has_secret }}
      scratch_status: ${{ steps.phase.outputs.scratch_status }}
      apex_status: ${{ steps.phase.outputs.apex_status }}
      publish_status: ${{ steps.phase.outputs.publish_status }}
      eval_status: ${{ steps.phase.outputs.eval_status }}
      agent_version: ${{ steps.phase.outputs.agent_version }}
      eval_run_id: ${{ steps.phase.outputs.eval_run_id }}
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - id: gate
        name: check for Dev Hub secret
        run: |
          echo "has_secret=${{ secrets.DX_AUTH_URL != '' }}" >> $GITHUB_OUTPUT
      - name: install Salesforce CLI
        if: steps.gate.outputs.has_secret == 'true'
        run: npm i -g @salesforce/cli@2.157.8
      - name: authorize Dev Hub
        if: steps.gate.outputs.has_secret == 'true'
        env:
          DX_AUTH_URL: ${{ secrets.DX_AUTH_URL }}
        run: printf '%s' "$DX_AUTH_URL" > /tmp/sfdx-auth.txt && sf org login sfdx-url -f /tmp/sfdx-auth.txt -a dx-hub && rm -f /tmp/sfdx-auth.txt
      - name: create disposable scratch org
        if: steps.gate.outputs.has_secret == 'true'
        run: |
          set -o pipefail
          mkdir -p scratch-results
          echo "Candidate commit: $GITHUB_SHA" | tee scratch-results/candidate.txt
          sf org create scratch -v dx-hub -f config/project-scratch-def.json -a ci-triage -y 1 -w 10 -d --json | tee scratch-results/scratch-create.json
          python3 scripts/verify_sf_output.py json scratch-results/scratch-create.json
      - name: deploy candidate revision to scratch org
        if: steps.gate.outputs.has_secret == 'true'
        run: |
          set -o pipefail
          sf project deploy start -o ci-triage -x manifests/service-triage-validation.xml -l RunSpecifiedTests -t ServiceTriageActionTest -w 10 --coverage-formatters json --junit --results-dir scratch-results --json | tee scratch-results/scratch-deploy.json
          python3 scripts/verify_sf_output.py deploy scratch-results/scratch-deploy.json
      - name: assign permission set
        if: steps.gate.outputs.has_secret == 'true'
        run: |
          set -o pipefail
          sf org assign permset -n Agentforce_Foundry_Service -o ci-triage --json | tee scratch-results/permset.json
          python3 scripts/verify_sf_output.py json scratch-results/permset.json
      - name: establish agent runtime user in scratch org
        if: steps.gate.outputs.has_secret == 'true'
        run: |
          set -o pipefail
          ORG_ALIAS=ci-triage bash scripts/setup-agent-user.sh 2>&1 | tee scratch-results/agent-user-setup.log
          mv agent-user-ci-triage*.json scratch-results/
          python3 -c 'import json; print("runtime user:", json.load(open("scratch-results/agent-user-ci-triage.json"))["username"])'
      - name: run Apex tests against installed candidate code
        if: steps.gate.outputs.has_secret == 'true'
        run: |
          set -o pipefail
          mkdir -p scratch-results/apex
          sf apex run test -o ci-triage -n ServiceTriageActionTest -r junit -d scratch-results/apex -w 10 -c --json | tee scratch-results/apex-run.json
          python3 scripts/verify_sf_output.py apex scratch-results/apex-run.json
      - name: convert committed scenarios to a test spec
        if: steps.gate.outputs.has_secret == 'true'
        run: python3 tests/eval/convert_service_scenarios.py --out-spec scratch-results/Service_Triage-testSpec.yaml --out-map scratch-results/Service_Triage-testMap.json
      - name: validate authoring bundle compile
        if: steps.gate.outputs.has_secret == 'true'
        run: |
          set -o pipefail
          sf agent validate authoring-bundle -n Service_Triage_Agent -o ci-triage --json | tee scratch-results/agent-validate.json
          python3 scripts/verify_sf_output.py agent-validate scratch-results/agent-validate.json
      - name: publish candidate agent version
        if: steps.gate.outputs.has_secret == 'true'
        run: |
          set -o pipefail
          RUNTIME_USER="$(python3 -c 'import json; print(json.load(open("scratch-results/agent-user-ci-triage.json"))["username"])')"
          echo "Publishing with runtime user $RUNTIME_USER"
          ls force-app/main/default/bots/Service_Triage_Agent > scratch-results/publish-before.txt 2>/dev/null || true
          cp force-app/main/default/aiAuthoringBundles/Service_Triage_Agent/Service_Triage_Agent.agent /tmp/agent-backup.agent
          sed "s/UPDATE_WITH_DEFAULT_AGENT_USER/$RUNTIME_USER/" /tmp/agent-backup.agent > force-app/main/default/aiAuthoringBundles/Service_Triage_Agent/Service_Triage_Agent.agent
          set +e
          sf agent publish authoring-bundle -n Service_Triage_Agent -o ci-triage --json | tee scratch-results/agent-publish.json
          PUBLISH_STATUS=${PIPESTATUS[0]}
          set -e
          cp /tmp/agent-backup.agent force-app/main/default/aiAuthoringBundles/Service_Triage_Agent/Service_Triage_Agent.agent
          echo "Agent file restored to placeholder state."
          if [ "$PUBLISH_STATUS" -ne 0 ]; then
            echo "Publish failed with exit $PUBLISH_STATUS. Output kept in scratch-results/agent-publish.json."
            exit "$PUBLISH_STATUS"
          fi
      - name: verify publish and determine candidate version
        if: steps.gate.outputs.has_secret == 'true'
        run: |
          python3 scripts/verify_sf_output.py agent-publish scratch-results/agent-publish.json
          ls force-app/main/default/bots/Service_Triage_Agent | tee scratch-results/published-versions.txt
          ls force-app/main/default/bots/Service_Triage_Agent > scratch-results/publish-after.txt
          python3 scripts/verify_sf_output.py publish-diff scratch-results/publish-before.txt scratch-results/publish-after.txt | tee scratch-results/agent-version.txt
      - name: activate candidate in the disposable org
        if: steps.gate.outputs.has_secret == 'true'
        run: |
          set -o pipefail
          CANDIDATE="$(cat scratch-results/agent-version.txt)"
          echo "Activating $CANDIDATE in disposable org ci-triage (user org activation stays a later manual choice)."
          sf agent activate -n Service_Triage_Agent --version "${CANDIDATE#v}" -o ci-triage --json | tee scratch-results/agent-activate.json
          python3 scripts/verify_sf_output.py agent-activate scratch-results/agent-activate.json --expect-version "${CANDIDATE#v}"
      - name: resolve spec names against the candidate version
        if: steps.gate.outputs.has_secret == 'true'
        run: python3 tests/eval/resolve_eval_metadata.py --spec scratch-results/Service_Triage-testSpec.yaml --map scratch-results/Service_Triage-testMap.json --agent Service_Triage_Agent --version "$(cat scratch-results/agent-version.txt)" --project-root . --out-spec scratch-results/Service_Triage-testSpec.resolved.yaml --report scratch-results/resolve-report.json
      - name: create agent test from resolved spec
        if: steps.gate.outputs.has_secret == 'true'
        run: |
          set -o pipefail
          sf agent test create --spec scratch-results/Service_Triage-testSpec.resolved.yaml --api-name Service_Triage_Agent_Test --force-overwrite -o ci-triage --json | tee scratch-results/agent-test-create.json
          python3 scripts/verify_sf_output.py agent-test-create scratch-results/agent-test-create.json
      - name: run agent test and score against thresholds
        if: steps.gate.outputs.has_secret == 'true'
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          mkdir -p scratch-results/agent-eval
          sf agent test run -n Service_Triage_Agent_Test -o ci-triage -w 10 --result-format json -d scratch-results/agent-eval --json | tee scratch-results/agent-test-run.json
          RUN_LINE="$(python3 scripts/verify_sf_output.py agent-test-run scratch-results/agent-test-run.json)"
          echo "$RUN_LINE"
          RUN_ID="$(echo "$RUN_LINE" | sed -n 's/^agent-test-run id=//p')"
          CANDIDATE="$(cat scratch-results/agent-version.txt)"
          python3 tests/eval/check_agent_results.py --results scratch-results/agent-eval --map scratch-results/Service_Triage-testMap.json --commit "$GITHUB_SHA" --pr-head "$PR_HEAD" --agent-version "$CANDIDATE" --run-id "$RUN_ID" --resolve-report scratch-results/resolve-report.json --out scratch-results/service-triage-eval.json
      - id: phase
        name: record scratch phase statuses from payloads
        if: always() && steps.gate.outputs.has_secret == 'true'
        run: |
          python3 - <<'PY' >> $GITHUB_OUTPUT
          import json
          from pathlib import Path
          def payload(name):
            path = Path("scratch-results") / name
            if not path.exists():
              return None
            try:
              data = json.loads(path.read_text())
            except Exception:
              return None
            return data.get("result", data) if isinstance(data.get("result"), dict) else data
          def unwrap_main(name):
            path = Path("scratch-results") / name
            if not path.exists():
              return None
            try:
              return json.loads(path.read_text())
            except Exception:
              return None
          deploy = payload("scratch-deploy.json")
          deployed = isinstance(deploy, dict) and deploy.get("status") == "Succeeded" and deploy.get("success") is True
          print("scratch_status=" + ("deployed" if deployed else "failed"))
          apex = payload("apex-run.json")
          summary = apex.get("summary") if isinstance(apex, dict) else None
          apex_ok = (isinstance(summary, dict) and summary.get("failing") == 0
                     and isinstance(summary.get("testsRan"), int) and summary.get("testsRan") > 0)
          print("apex_status=" + ("passed" if apex_ok else "failed"))
          publish = payload("agent-publish.json")
          version_file = Path("scratch-results/agent-version.txt")
          activate = payload("agent-activate.json")
          version = version_file.read_text().strip() if version_file.exists() else ""
          published = (isinstance(publish, dict) and publish.get("success") is True
                       and bool(version) and isinstance(activate, dict)
                       and activate.get("success") is True
                       and str(activate.get("version")) == version.lstrip("v"))
          print("publish_status=" + ("published" if published else "failed"))
          print("agent_version=" + (version or "none"))
          evaluation = unwrap_main("service-triage-eval.json")
          run_stdout = payload("agent-test-run.json")
          run_id = run_stdout.get("runId", "") if isinstance(run_stdout, dict) else ""
          print("eval_run_id=" + str(run_id or "none"))
          if isinstance(evaluation, dict) and evaluation.get("ok") is True:
            print("eval_status=evaluated")
          else:
            print("eval_status=failed")
          PY
      - name: delete disposable scratch org
        if: always() && steps.gate.outputs.has_secret == 'true'
        continue-on-error: true
        run: sf org delete scratch -o ci-triage
      - name: keep scratch results
        if: always() && steps.gate.outputs.has_secret == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: scratch-installed-results
          path: scratch-results
          if-no-files-found: warn
      - name: report skipped scratch path
        if: steps.gate.outputs.has_secret != 'true'
        run: |
          echo "Scratch path not run: no DX_AUTH_URL repository secret present."
          echo "This is not deployment proof. It means the installed code path was skipped honestly."
  org-validation-status:
    runs-on: ubuntu-latest
    needs: [org-validate, scratch-installed-tests]
    if: always()
    steps:
      - name: report org validation state
        env:
          VALIDATE_RESULT: ${{ needs['org-validate'].result }}
          SCRATCH_RESULT: ${{ needs['scratch-installed-tests'].result }}
          HAS_SECRET: ${{ needs['org-validate'].outputs.has_secret }}
          VALIDATION_STATUS: ${{ needs['org-validate'].outputs.validation_status }}
          DEPLOYMENT_ID: ${{ needs['org-validate'].outputs.deployment_id }}
          SCRATCH_STATUS: ${{ needs['scratch-installed-tests'].outputs.scratch_status }}
          APEX_STATUS: ${{ needs['scratch-installed-tests'].outputs.apex_status }}
          PUBLISH_STATUS: ${{ needs['scratch-installed-tests'].outputs.publish_status }}
          EVAL_STATUS: ${{ needs['scratch-installed-tests'].outputs.eval_status }}
          AGENT_VERSION: ${{ needs['scratch-installed-tests'].outputs.agent_version }}
          EVAL_RUN_ID: ${{ needs['scratch-installed-tests'].outputs.eval_run_id }}
        run: |
          echo "Validation job result: $VALIDATE_RESULT"
          echo "Scratch job result: $SCRATCH_RESULT"
          if [ "$VALIDATE_RESULT" = "skipped" ]; then
            echo "Status: skipped. Fork pull requests are excluded from org access."
            exit 0
          fi
          if [ "$HAS_SECRET" != "true" ]; then
            echo "Status: not_configured. No DX_AUTH_URL repository secret present."
            echo "Validation: skipped. Installed tests: skipped. Agent eval: skipped."
            exit 0
          fi
          if [ "$VALIDATE_RESULT" != "success" ]; then
            echo "Status: failed. Validation only deploy did not pass."
            echo "Validation: $VALIDATION_STATUS. Deployment: $DEPLOYMENT_ID."
            echo "Scratch path did not run because its prerequisite failed."
            exit 1
          fi
          echo "Validation: validation_passed. Deployment: $DEPLOYMENT_ID."
          if [ "$SCRATCH_RESULT" != "success" ]; then
            echo "Status: failed. Scratch path result: $SCRATCH_RESULT."
            echo "Scratch: $SCRATCH_STATUS. Apex: $APEX_STATUS. Publish: $PUBLISH_STATUS. Eval: $EVAL_STATUS."
            exit 1
          fi
          echo "Scratch: $SCRATCH_STATUS. Apex: $APEX_STATUS. Publish: $PUBLISH_STATUS. Eval: $EVAL_STATUS. Agent version: $AGENT_VERSION. Run: $EVAL_RUN_ID."
          if [ "$SCRATCH_STATUS" != "deployed" ] || [ "$APEX_STATUS" != "passed" ]; then
            echo "Status: failed. Deploy or Apex phase did not pass."
            exit 1
          fi
          if [ "$EVAL_STATUS" = "failed" ] || [ "$PUBLISH_STATUS" = "failed" ]; then
            echo "Status: failed. Publish or evaluation phase failed."
            exit 1
          fi
          echo "Status: passed. Validation, deploy, Apex, publish, and evaluation all verified from payloads."
