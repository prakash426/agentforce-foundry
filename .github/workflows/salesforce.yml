name: salesforce-validate
on:
  pull_request:
  workflow_dispatch:
jobs:
  org-validate:
    runs-on: ubuntu-latest
    outputs:
      has_secret: ${{ steps.gate.outputs.has_secret }}
      validation_status: ${{ steps.record.outputs.validation_status }}
      deployment_id: ${{ steps.record.outputs.deployment_id }}
      candidate_commit: ${{ steps.record.outputs.candidate_commit }}
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - id: gate
        name: check for validation secret
        run: echo "has_secret=${{ secrets.DX_AUTH_URL != '' }}" >> $GITHUB_OUTPUT
      - name: show tool versions
        if: steps.gate.outputs.has_secret == 'true'
        run: node -v && npm -v && python3 -V
      - name: install Salesforce CLI
        if: steps.gate.outputs.has_secret == 'true'
        run: npm i -g @salesforce/cli@2.157.8
      - name: authorize validation org
        if: steps.gate.outputs.has_secret == 'true'
        env:
          DX_AUTH_URL: ${{ secrets.DX_AUTH_URL }}
        run: printf '%s' "$DX_AUTH_URL" > /tmp/sfdx-auth.txt && sf org login sfdx-url -f /tmp/sfdx-auth.txt -a ci-org && rm -f /tmp/sfdx-auth.txt
      - name: validation only deploy of Service scope with its own test results
        if: steps.gate.outputs.has_secret == 'true'
        run: |
          set -o pipefail
          mkdir -p validation-results
          echo "Candidate commit: $GITHUB_SHA" | tee validation-results/candidate.txt
          sf project deploy start -o ci-org -x manifests/service-triage-validation.xml -l RunSpecifiedTests -t ServiceTriageActionTest -w 10 --dry-run --coverage-formatters json --coverage-formatters cobertura --junit --results-dir validation-results --json | tee validation-results/deploy-validation.json
      - id: record
        name: record validation identifiers
        if: steps.gate.outputs.has_secret == 'true'
        run: |
          python3 - <<'PY' >> $GITHUB_OUTPUT
          import json
          commit = "${{ github.sha }}"
          print("candidate_commit=" + commit)
          try:
            data = json.load(open("validation-results/deploy-validation.json"))
            result = data.get("result", {})
            print("deployment_id=" + str(result.get("id", "unknown")))
            print("validation_status=passed")
          except Exception as exc:
            print("deployment_id=unknown")
            print("validation_status=failed")
            print("parse note: " + str(exc))
          PY
          cat validation-results/candidate.txt
      - name: keep validation only results
        if: always() && steps.gate.outputs.has_secret == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: validation-only-results
          path: validation-results
          if-no-files-found: warn
      - name: report skipped validation
        if: steps.gate.outputs.has_secret != 'true'
        run: |
          echo "Org validation not run: no DX_AUTH_URL repository secret present."
          echo "Add the secret to enable this path."
          echo "This is not deployment proof. It means the org path was skipped honestly."
  scratch-installed-tests:
    runs-on: ubuntu-latest
    needs: [org-validate]
    outputs:
      has_secret: ${{ steps.gate.outputs.has_secret }}
      scratch_status: ${{ steps.phase.outputs.scratch_status }}
      apex_status: ${{ steps.phase.outputs.apex_status }}
      publish_status: ${{ steps.phase.outputs.publish_status }}
      eval_status: ${{ steps.phase.outputs.eval_status }}
      agent_version: ${{ steps.phase.outputs.agent_version }}
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - id: gate
        name: check for Dev Hub secret
        run: |
          echo "has_secret=${{ secrets.DX_AUTH_URL != '' }}" >> $GITHUB_OUTPUT
          echo "has_agent_user=${{ secrets.AGENT_USER != '' }}" >> $GITHUB_OUTPUT
      - name: install Salesforce CLI
        if: steps.gate.outputs.has_secret == 'true'
        run: npm i -g @salesforce/cli@2.157.8
      - name: authorize Dev Hub
        if: steps.gate.outputs.has_secret == 'true'
        env:
          DX_AUTH_URL: ${{ secrets.DX_AUTH_URL }}
        run: printf '%s' "$DX_AUTH_URL" > /tmp/sfdx-auth.txt && sf org login sfdx-url -f /tmp/sfdx-auth.txt -a dx-hub && rm -f /tmp/sfdx-auth.txt
      - name: create disposable scratch org
        if: steps.gate.outputs.has_secret == 'true'
        run: |
          set -o pipefail
          mkdir -p scratch-results
          echo "Candidate commit: $GITHUB_SHA" | tee scratch-results/candidate.txt
          sf org create scratch -v dx-hub -f config/project-scratch-def.json -a ci-triage -y 1 -w 10 -d --json | tee scratch-results/scratch-create.json
      - name: deploy candidate revision to scratch org
        if: steps.gate.outputs.has_secret == 'true'
        run: |
          set -o pipefail
          sf project deploy start -o ci-triage -x manifests/service-triage-validation.xml -l RunSpecifiedTests -t ServiceTriageActionTest -w 10 --coverage-formatters json --junit --results-dir scratch-results --json | tee scratch-results/scratch-deploy.json
      - name: assign permission set
        if: steps.gate.outputs.has_secret == 'true'
        run: sf org assign permset -n Agentforce_Foundry_Service -o ci-triage
      - name: run Apex tests against installed candidate code
        if: steps.gate.outputs.has_secret == 'true'
        run: |
          set -o pipefail
          mkdir -p scratch-results/apex
          sf apex run test -o ci-triage -n ServiceTriageActionTest -r junit -d scratch-results/apex -w 10 -c --json | tee scratch-results/apex-run.json
      - name: convert committed scenarios to a test spec
        if: steps.gate.outputs.has_secret == 'true'
        run: python3 tests/eval/convert_service_scenarios.py --out-spec scratch-results/Service_Triage-testSpec.yaml --out-map scratch-results/Service_Triage-testMap.json
      - name: validate authoring bundle compile
        if: steps.gate.outputs.has_secret == 'true'
        run: |
          set -o pipefail
          sf agent validate authoring-bundle -n Service_Triage_Agent -o ci-triage --json | tee scratch-results/agent-validate.json
      - name: publish candidate agent version
        if: steps.gate.outputs.has_secret == 'true' && steps.gate.outputs.has_agent_user == 'true'
        env:
          AGENT_USER: ${{ secrets.AGENT_USER }}
        run: |
          set -o pipefail
          cp force-app/main/default/aiAuthoringBundles/Service_Triage_Agent/Service_Triage_Agent.agent /tmp/agent-backup.agent
          sed "s/UPDATE_WITH_DEFAULT_AGENT_USER/$AGENT_USER/" /tmp/agent-backup.agent > force-app/main/default/aiAuthoringBundles/Service_Triage_Agent/Service_Triage_Agent.agent
          sf agent publish authoring-bundle -n Service_Triage_Agent -o ci-triage --json | tee scratch-results/agent-publish.json
          cp /tmp/agent-backup.agent force-app/main/default/aiAuthoringBundles/Service_Triage_Agent/Service_Triage_Agent.agent
          ls force-app/main/default/bots/Service_Triage_Agent/ | tee scratch-results/published-versions.txt
      - name: create and run agent test from converted spec
        if: steps.gate.outputs.has_secret == 'true' && steps.gate.outputs.has_agent_user == 'true'
        run: |
          set -o pipefail
          mkdir -p scratch-results/agent-eval
          sf agent test create --spec scratch-results/Service_Triage-testSpec.yaml --api-name Service_Triage_Agent_Test --force-overwrite -o ci-triage --json | tee scratch-results/agent-test-create.json
          sf agent test run -n Service_Triage_Agent_Test -o ci-triage -w 10 --result-format json -d scratch-results/agent-eval --json | tee scratch-results/agent-test-run.json
          AGENT_VERSION="$(ls force-app/main/default/bots/Service_Triage_Agent/ | grep -o 'v[0-9]*' | sort -V | tail -n 1)"
          echo "Candidate agent version: $AGENT_VERSION" | tee scratch-results/agent-version.txt
          python3 tests/eval/check_agent_results.py --results scratch-results/agent-eval --map scratch-results/Service_Triage-testMap.json --commit "$GITHUB_SHA" --agent-version "$AGENT_VERSION" --run-id Service_Triage_Agent_Test --out scratch-results/service-triage-eval.json
      - id: phase
        name: record scratch phase statuses
        if: always() && steps.gate.outputs.has_secret == 'true'
        run: |
          python3 - <<'PY' >> $GITHUB_OUTPUT
          from pathlib import Path
          def exists(name):
            return Path("scratch-results/" + name).exists()
          print("scratch_status=" + ("deployed" if exists("scratch-deploy.json") else "failed"))
          print("apex_status=" + ("passed" if exists("apex-run.json") else "failed"))
          if exists("agent-publish.json"):
            print("publish_status=published")
          elif "${{ steps.gate.outputs.has_agent_user }}" == "true":
            print("publish_status=failed")
          else:
            print("publish_status=not_configured")
          if exists("service-triage-eval.json"):
            import json
            record = json.load(open("scratch-results/service-triage-eval.json"))
            print("eval_status=" + ("evaluated" if record.get("ok") else "failed"))
            print("agent_version=" + str(record.get("agent_version", "unknown")))
          elif "${{ steps.gate.outputs.has_agent_user }}" == "true":
            print("eval_status=failed")
            print("agent_version=unknown")
          else:
            print("eval_status=not_configured")
            print("agent_version=none")
          PY
      - name: delete disposable scratch org
        if: always() && steps.gate.outputs.has_secret == 'true'
        continue-on-error: true
        run: sf org delete scratch -o ci-triage
      - name: keep scratch results
        if: always() && steps.gate.outputs.has_secret == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: scratch-installed-results
          path: scratch-results
          if-no-files-found: warn
      - name: report skipped scratch path
        if: steps.gate.outputs.has_secret != 'true'
        run: |
          echo "Scratch path not run: no DX_AUTH_URL repository secret present."
          echo "This is not deployment proof. It means the installed code path was skipped honestly."
  org-validation-status:
    runs-on: ubuntu-latest
    needs: [org-validate, scratch-installed-tests]
    if: always()
    steps:
      - name: report org validation state
        env:
          VALIDATE_RESULT: ${{ needs['org-validate'].result }}
          SCRATCH_RESULT: ${{ needs['scratch-installed-tests'].result }}
          HAS_SECRET: ${{ needs['org-validate'].outputs.has_secret }}
          VALIDATION_STATUS: ${{ needs['org-validate'].outputs.validation_status }}
          DEPLOYMENT_ID: ${{ needs['org-validate'].outputs.deployment_id }}
          SCRATCH_STATUS: ${{ needs['scratch-installed-tests'].outputs.scratch_status }}
          APEX_STATUS: ${{ needs['scratch-installed-tests'].outputs.apex_status }}
          PUBLISH_STATUS: ${{ needs['scratch-installed-tests'].outputs.publish_status }}
          EVAL_STATUS: ${{ needs['scratch-installed-tests'].outputs.eval_status }}
          AGENT_VERSION: ${{ needs['scratch-installed-tests'].outputs.agent_version }}
        run: |
          echo "Validation job result: $VALIDATE_RESULT"
          echo "Scratch job result: $SCRATCH_RESULT"
          if [ "$VALIDATE_RESULT" = "skipped" ]; then
            echo "Status: skipped. Fork pull requests are excluded from org access."
            exit 0
          fi
          if [ "$HAS_SECRET" != "true" ]; then
            echo "Status: not_configured. No DX_AUTH_URL repository secret present."
            echo "Validation: skipped. Installed tests: skipped. Agent eval: skipped."
            exit 0
          fi
          if [ "$VALIDATE_RESULT" != "success" ]; then
            echo "Status: failed. Validation only deploy did not pass."
            echo "Validation: $VALIDATION_STATUS. Deployment: $DEPLOYMENT_ID."
            echo "Scratch path did not run because its prerequisite failed."
            exit 1
          fi
          echo "Validation: validation_passed. Deployment: $DEPLOYMENT_ID."
          if [ "$SCRATCH_RESULT" != "success" ]; then
            echo "Status: failed. Scratch path result: $SCRATCH_RESULT."
            echo "Scratch: $SCRATCH_STATUS. Apex: $APEX_STATUS. Publish: $PUBLISH_STATUS. Eval: $EVAL_STATUS."
            exit 1
          fi
          echo "Scratch: $SCRATCH_STATUS. Apex: $APEX_STATUS. Publish: $PUBLISH_STATUS. Eval: $EVAL_STATUS. Agent version: $AGENT_VERSION."
          if [ "$SCRATCH_STATUS" != "deployed" ] || [ "$APEX_STATUS" != "passed" ]; then
            echo "Status: failed. Deploy or Apex phase did not pass."
            exit 1
          fi
          if [ "$EVAL_STATUS" = "failed" ] || [ "$PUBLISH_STATUS" = "failed" ]; then
            echo "Status: failed. Publish or evaluation phase failed."
            exit 1
          fi
          echo "Status: passed with noted phases. Anything marked not_configured was skipped honestly, never as proof."
