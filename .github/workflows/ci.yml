name: foundry-ci
on:
  push:
  pull_request:
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: run offline validator
        run: python3 tests/harness/validate_kits.py
      - name: run harness unit checks
        run: python3 tests/harness/test_validate_kits.py
      - name: run scenario audit
        run: python3 tests/eval/audit_service_scenarios.py
      - name: run converter and eval tool checks
        run: python3 tests/eval/test_agent_eval_tools.py
      - name: convert scenarios to a test spec
        run: python3 tests/eval/convert_service_scenarios.py --out-spec specs/Service_Triage_Agent-testSpec.yaml --out-map specs/Service_Triage_Agent-testMap.json
      - name: check shell script syntax
        run: sh -n scripts/setup-service-triage.sh && sh -n scripts/setup.sh && sh -n scripts/create-service-triage-test.sh && echo "shell syntax ok"
      - name: keep audit results
        uses: actions/upload-artifact@v7
        with:
          name: service-triage-audit
          path: |
            tests/eval/results/service-triage-audit.json
            specs/Service_Triage_Agent-testSpec.yaml
            specs/Service_Triage_Agent-testMap.json
          if-no-files-found: error
