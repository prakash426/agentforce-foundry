name: foundry-ci
on:
  push:
  pull_request:
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: run offline validator
        run: python3 tests/harness/validate_kits.py
      - name: run harness tests
        run: python3 tests/harness/test_validate_kits.py
